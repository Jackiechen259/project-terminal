<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Terminal</title>
    <script>
      // Apply the persisted theme while the document is still being parsed so
      // the first WebView frame matches the application instead of flashing.
      try {
        const settings = JSON.parse(
          localStorage.getItem("project-terminal.general-settings") || "null",
        );
        const theme = settings?.state?.theme;
        if (theme === "dark" || theme === "eye-care" || theme === "light") {
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme =
            theme === "dark" ? "dark" : "light";
        }
      } catch {
        // Invalid persisted settings are handled by the application store.
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --startup-background: #09090b;
        --startup-surface: #18181b;
        --startup-foreground: #fafafa;
        --startup-muted: #a1a1aa;
        --startup-border: #27272a;
        --startup-accent: hsl(210 75% 56%);
      }

      :root[data-theme="eye-care"] {
        color-scheme: light;
        --startup-background: hsl(43 45% 93%);
        --startup-surface: hsl(42 36% 90%);
        --startup-foreground: hsl(35 18% 18%);
        --startup-muted: hsl(35 12% 42%);
        --startup-border: hsl(38 22% 78%);
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --startup-background: #ffffff;
        --startup-surface: hsl(240 20% 98%);
        --startup-foreground: hsl(240 10% 3.9%);
        --startup-muted: hsl(240 3.8% 46.1%);
        --startup-border: hsl(240 5.9% 90%);
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--startup-background);
      }

      body {
        color: var(--startup-foreground);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .startup-shell {
        display: flex;
        width: 100%;
        height: 100%;
        flex-direction: column;
        background: var(--startup-background);
      }

      .startup-titlebar {
        box-sizing: border-box;
        display: flex;
        height: 40px;
        flex: 0 0 40px;
        align-items: center;
        border-bottom: 1px solid var(--startup-border);
        background: var(--startup-surface);
        user-select: none;
        -webkit-user-select: none;
      }

      .startup-brand {
        display: flex;
        min-width: 0;
        flex: 1;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        pointer-events: none;
      }

      .startup-mark {
        display: grid;
        width: 20px;
        height: 20px;
        flex: 0 0 20px;
        place-items: center;
        border-radius: 5px;
        background: hsl(210 75% 56%);
        box-shadow: 0 0 12px hsl(210 75% 56% / 0.26);
        color: white;
        font-family: Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
      }

      .startup-name {
        overflow: hidden;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.01em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .startup-context {
        color: var(--startup-muted);
        font-size: 11px;
      }

      .startup-controls {
        display: flex;
        height: 100%;
        pointer-events: none;
      }

      .startup-control {
        position: relative;
        width: 46px;
        height: 100%;
      }

      .startup-control::before,
      .startup-control::after {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 1px;
        background: currentColor;
        content: "";
        transform: translate(-50%, -50%);
      }

      .startup-control--maximize::before {
        width: 8px;
        height: 8px;
        border: 1px solid currentColor;
        background: transparent;
      }

      .startup-control--close::before {
        transform: translate(-50%, -50%) rotate(45deg);
      }

      .startup-control--close::after {
        transform: translate(-50%, -50%) rotate(-45deg);
      }

      .startup-stage {
        display: grid;
        min-height: 0;
        flex: 1;
        place-items: center;
        pointer-events: none;
      }

      .startup-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        transform: translateY(-20px);
      }

      .startup-terminal {
        position: relative;
        display: flex;
        box-sizing: border-box;
        width: 58px;
        height: 52px;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid var(--startup-border);
        border-radius: 10px;
        background: var(--startup-surface);
        box-shadow:
          0 12px 32px rgb(0 0 0 / 0.18),
          0 0 24px hsl(210 75% 56% / 0.1);
        color: var(--startup-accent);
        font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -1px;
        animation: startup-float 1.8s ease-in-out infinite;
        will-change: transform;
      }

      .startup-terminal::before {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 11px;
        border-bottom: 1px solid var(--startup-border);
        background:
          radial-gradient(
            circle at 8px 50%,
            hsl(0 72% 62%) 0 2px,
            transparent 2.5px
          ),
          radial-gradient(
            circle at 15px 50%,
            hsl(42 86% 61%) 0 2px,
            transparent 2.5px
          ),
          radial-gradient(
            circle at 22px 50%,
            hsl(142 55% 50%) 0 2px,
            transparent 2.5px
          );
        content: "";
        opacity: 0.8;
      }

      .startup-prompt {
        margin-top: 7px;
      }

      .startup-caret {
        margin-top: 7px;
        animation: startup-caret 0.9s steps(1, end) infinite;
      }

      .startup-progress {
        width: 112px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--startup-border);
      }

      .startup-progress::after {
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          transparent,
          var(--startup-accent) 42%,
          var(--startup-accent) 58%,
          transparent
        );
        content: "";
        animation: startup-progress 1.15s ease-in-out infinite;
        will-change: transform;
      }

      @keyframes startup-float {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-4px);
        }
      }

      @keyframes startup-caret {
        0%,
        48% {
          opacity: 1;
        }

        49%,
        100% {
          opacity: 0.18;
        }
      }

      @keyframes startup-progress {
        0% {
          transform: translateX(-130%);
        }

        55% {
          transform: translateX(95%);
        }

        100% {
          transform: translateX(230%);
        }
      }

      @media (max-width: 639px) {
        .startup-context {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-terminal,
        .startup-caret,
        .startup-progress::after {
          animation: none;
        }

        .startup-progress::after {
          width: 100%;
          opacity: 0.55;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-shell" aria-hidden="true">
        <div class="startup-titlebar" data-tauri-drag-region>
          <div class="startup-brand">
            <span class="startup-mark">&gt;_</span>
            <span class="startup-name">Project Terminal</span>
            <span class="startup-context">Workspace</span>
          </div>
          <div class="startup-controls">
            <span class="startup-control"></span>
            <span class="startup-control startup-control--maximize"></span>
            <span class="startup-control startup-control--close"></span>
          </div>
        </div>
        <div class="startup-stage">
          <div class="startup-loader">
            <div class="startup-terminal">
              <span class="startup-prompt">&gt;</span>
              <span class="startup-caret">_</span>
            </div>
            <div class="startup-progress"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
