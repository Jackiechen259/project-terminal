<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Terminal</title>
    <script>
      // Apply the persisted theme while the document is still being parsed so
      // the first WebView frame matches the application instead of flashing.
      try {
        const settings = JSON.parse(
          localStorage.getItem("project-terminal.general-settings") || "null",
        );
        const theme = settings?.state?.theme;
        if (theme === "dark" || theme === "eye-care" || theme === "light") {
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme =
            theme === "dark" ? "dark" : "light";
        }
      } catch {
        // Invalid persisted settings are handled by the application store.
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --startup-background: #09090b;
        --startup-surface: #18181b;
        --startup-foreground: #fafafa;
        --startup-muted: #a1a1aa;
        --startup-border: #27272a;
      }

      :root[data-theme="eye-care"] {
        color-scheme: light;
        --startup-background: hsl(43 45% 93%);
        --startup-surface: hsl(42 36% 90%);
        --startup-foreground: hsl(35 18% 18%);
        --startup-muted: hsl(35 12% 42%);
        --startup-border: hsl(38 22% 78%);
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --startup-background: #ffffff;
        --startup-surface: hsl(240 20% 98%);
        --startup-foreground: hsl(240 10% 3.9%);
        --startup-muted: hsl(240 3.8% 46.1%);
        --startup-border: hsl(240 5.9% 90%);
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--startup-background);
      }

      body {
        color: var(--startup-foreground);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .startup-shell {
        display: flex;
        width: 100%;
        height: 100%;
        flex-direction: column;
        background: var(--startup-background);
      }

      .startup-titlebar {
        box-sizing: border-box;
        display: flex;
        height: 40px;
        flex: 0 0 40px;
        align-items: center;
        border-bottom: 1px solid var(--startup-border);
        background: var(--startup-surface);
        user-select: none;
        -webkit-user-select: none;
      }

      .startup-brand {
        display: flex;
        min-width: 0;
        flex: 1;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        pointer-events: none;
      }

      .startup-mark {
        display: grid;
        width: 20px;
        height: 20px;
        flex: 0 0 20px;
        place-items: center;
        border-radius: 5px;
        background: hsl(210 75% 56%);
        box-shadow: 0 0 12px hsl(210 75% 56% / 0.26);
        color: white;
        font-family: Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
      }

      .startup-name {
        overflow: hidden;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.01em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .startup-context {
        color: var(--startup-muted);
        font-size: 11px;
      }

      .startup-controls {
        display: flex;
        height: 100%;
        pointer-events: none;
      }

      .startup-control {
        position: relative;
        width: 46px;
        height: 100%;
      }

      .startup-control::before,
      .startup-control::after {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 1px;
        background: currentColor;
        content: "";
        transform: translate(-50%, -50%);
      }

      .startup-control--maximize::before {
        width: 8px;
        height: 8px;
        border: 1px solid currentColor;
        background: transparent;
      }

      .startup-control--close::before {
        transform: translate(-50%, -50%) rotate(45deg);
      }

      .startup-control--close::after {
        transform: translate(-50%, -50%) rotate(-45deg);
      }

      @media (max-width: 639px) {
        .startup-context {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-shell" aria-hidden="true">
        <div class="startup-titlebar" data-tauri-drag-region>
          <div class="startup-brand">
            <span class="startup-mark">&gt;_</span>
            <span class="startup-name">Project Terminal</span>
            <span class="startup-context">Workspace</span>
          </div>
          <div class="startup-controls">
            <span class="startup-control"></span>
            <span class="startup-control startup-control--maximize"></span>
            <span class="startup-control startup-control--close"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
