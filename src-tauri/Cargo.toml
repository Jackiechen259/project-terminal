[package]
name = "project-terminal"
version = "0.5.8"
description = "Project Terminal - a Windows desktop terminal organized by projects"
authors = ["Project Terminal"]
edition = "2021"
rust-version = "1.77.2"
default-run = "project-terminal"

[lib]
name = "project_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
portable-pty = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "io-util", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
bytes = "1"
tempfile = "3"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging"] }
# Reports the real OS build. `GetVersionExW` lies without an application
# manifest; this reads the version resource instead. xterm.js needs the build
# to pick the right ConPTY resize model.
windows-version = "0.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Cross-crate inlining matters here: the PTY hot path spans session, scrollback
# and the Tauri IPC layer.
lto = true
codegen-units = 1
strip = true
# `panic = "abort"` would shrink the binary further, but a panic in one PTY
# reader thread would then take down every terminal instead of just that
# session, so it is deliberately left off.
