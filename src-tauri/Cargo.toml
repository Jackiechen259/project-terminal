[package]
name = "project-terminal"
version = "0.6.1"
description = "Project Terminal - a Windows desktop terminal organized by projects"
authors = ["Project Terminal"]
edition = "2021"
rust-version = "1.77.2"
default-run = "project-terminal"
# Only the explicit `[[test]] unit` target below is built by `cargo test`.
# The auto-generated lib/bin test harnesses are suppressed because they cannot
# receive the Common-Controls v6 manifest (tauri-build only emits it for bin
# targets) and would fail to start with STATUS_ENTRYPOINT_NOT_FOUND when they
# link muda's TaskDialogIndirect import against the system comctl32.
autotests = false

[lib]
name = "project_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# The library's own unit-test harness is disabled: it cannot receive the
# Common-Controls v6 manifest (see the `[[test]] unit` note below) and would
# fail to start on Windows when it links muda's TaskDialogIndirect import.
# All unit tests run through the explicit `unit` integration test instead.
test = false

# Explicit test target so `cargo:rustc-link-arg-tests` can pass the
# Common-Controls v6 manifest to the unit-test harness (see build.rs).
[[test]]
name = "unit"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
portable-pty = "0.8"
# Pin the terminal model to a reviewed upstream revision. Do not replace this
# with branch = "main": the engine API and dependency graph are intentionally
# reproducible during the migration.
wezterm-term = { git = "https://github.com/wezterm/wezterm.git", rev = "770d8e1a7519a9a698090cd7d717d0c64aa0a755" }
wezterm-cell = { git = "https://github.com/wezterm/wezterm.git", rev = "770d8e1a7519a9a698090cd7d717d0c64aa0a755" }
# Terminal cursor enums are exposed by wezterm-term through this dependency's
# public CursorPosition fields; keep the direct API pin aligned with the core.
wezterm-surface = { git = "https://github.com/wezterm/wezterm.git", rev = "770d8e1a7519a9a698090cd7d717d0c64aa0a755" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "io-util", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
tempfile = "3"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging"] }
# Reports the real OS build. `GetVersionExW` lies without an application
# manifest; this reads the version resource instead. The terminal engine needs
# the build to pick the right ConPTY resize model.
windows-version = "0.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Cross-crate inlining matters here: the PTY hot path spans session, terminal
# model parsing, and the Tauri IPC layer.
lto = true
codegen-units = 1
strip = true
# `panic = "abort"` would shrink the binary further, but a panic in one PTY
# reader thread would then take down every terminal instead of just that
# session, so it is deliberately left off.
