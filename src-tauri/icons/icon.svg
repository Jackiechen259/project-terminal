      <stop offset="0.48" stop-color="#162A5B"/>
      <stop offset="1" stop-color="#291A57"/>
    </linearGradient>
    <linearGradient id="edge" x1="118" y1="128" x2="400" y2="392" gradientUnits="userSpaceOnUse">
